name: ci

# nuget.org's trusted publishing policies name this file, so releasing happens here too: publishing the
# release-drafter draft (web UI or phone) fires `release: published`, and the release job below runs on it.
# Only v<version> releases publish packages. Model checkpoints release under models-<version> tags through
# release-models.yml; the release job skips those.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release runs no tests of its own: the shared release workflow's main-green job requires main's full run, macOS
  # included, to have passed on the released commit.
  build:
    if: github.event_name != 'release'
    uses: nullean/.github/.github/workflows/dotnet-ci.yml@e21d5f59405aa7078e51825cd4c407191e28562f # v1.6.1
    permissions:
      contents: read
    with:
      # Linux only, as before: aot-validate below covers the native dependencies on all three operating systems
      os: '["ubuntu-latest"]'
      packages-path: build/output

  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@e21d5f59405aa7078e51825cd4c407191e28562f # v1.6.1
    permissions:
      contents: read

  # macOS runners are scarce: pull requests run Linux and Windows, main adds macOS.
  aot-validate:
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        smoketest:
        # layar-torchsharp-aot-smoketest exercises the much heavier TorchSharp/libtorch dependency
        # chain under PublishAot separately from the ONNX one, since the two backends pull in
        # entirely different native dependencies.
        - layar-aot-smoketest
        - layar-torchsharp-aot-smoketest
        os: >-
          ${{ fromJSON(github.event_name == 'push'
            && '[{"runner":"ubuntu-latest","ext":""},{"runner":"macos-latest","ext":""},{"runner":"windows-latest","ext":".exe"}]'
            || '[{"runner":"ubuntu-latest","ext":""},{"runner":"windows-latest","ext":".exe"}]') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        cache: false # this workflow publishes what it builds; never restore a cache a PR could have written
      env:
        MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

    - name: Publish AOT
      shell: bash
      env:
        SMOKETEST: ${{ matrix.smoketest }}
      run: dotnet publish "examples/$SMOKETEST"

    - name: Run AOT binary
      shell: bash
      env:
        SMOKETEST: ${{ matrix.smoketest }}
        EXT: ${{ matrix.os.ext }}
      run: |
        # TorchSharp-cpu's libtorch_cpu.dylib hardcodes an absolute load path to homebrew's
        # libomp.dylib on macOS (see AGENTS.md's rough edges) — DYLD_LIBRARY_PATH lets dyld fall
        # back to the copy already bundled next to the binary instead.
        if [ "$RUNNER_OS" = "macOS" ]; then
          export DYLD_LIBRARY_PATH="$PWD/.artifacts/publish/$SMOKETEST/release"
        fi
        "./.artifacts/publish/$SMOKETEST/release/$SMOKETEST$EXT"

  # every push to main publishes a canary build to GitHub Packages
  canary:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Push to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          until dotnet nuget push 'packages/*.nupkg' -k "$GITHUB_TOKEN" \
            -s https://nuget.pkg.github.com/nullean/index.json --skip-duplicate --no-symbols; do
            echo "Retrying"; sleep 1
          done

  # A published v<version> release packs at that tag and pushes to nuget.org. A models-<version> release never does.
  # packs at the release's tag in the shared workflow, which first fails unless main's ci.yml passed on the released
  # commit (its main-green job)...
  release:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: zizmor
    uses: nullean/.github/.github/workflows/release.yml@e21d5f59405aa7078e51825cd4c407191e28562f # v1.6.1
    permissions:
      actions: read # the main-green gate reads main's runs
      contents: write
    with:
      packages-path: build/output

  # ...and publishes from this file: nuget.org's trusted publishing checks that the token's workflow is this ci.yml,
  # which a job inside the shared workflow would not be.
  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # append the public API changes to the release notes
      id-token: write # NuGet trusted publishing: exchange the OIDC token for a short-lived key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: packages
      - uses: nullean/.github/actions/nuget-publish@e21d5f59405aa7078e51825cd4c407191e28562f # v1.6.1
        with:
          user: ${{ secrets.NUGET_USER }}
          packages-path: packages

  # The docs build as docs.yml publishes it, without publishing, so a PR proves the build and post-build steps.
  docs:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build documentation
        uses: elastic/docs-builder@036a375759d876e2df67955ebec0382cd6b09249 # v1
        env:
          FEATURE_NAVIGATION_PREVIEW: true

      - name: Theme and landing page
        run: scripts/docs-finish.sh .artifacts/docs/html
